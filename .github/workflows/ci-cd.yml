name: CI/CD Pipeline - Taller 6 (React, Vite, Render & ConfigCat)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    name: 🧪 Build, TypeScript Check & Bundle (DoD Técnico)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: TypeScript Check & Vite Build
        run: npm run build

      - name: Verify Dist Artifact
        run: |
          test -f dist/index.html && echo "✓ Build exitoso: dist/index.html generado correctamente para Render."

  render_deploy:
    name: 🚀 Render Continuous Deployment & Verification
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Disparando webhook de Render..."
            curl -X POST "$RENDER_HOOK"
            echo "Deploy enviado a Render con éxito."
          else
            echo "✓ Render Auto-Deploy activo por conexión nativa de Git en branch main."
          fi

      - name: Verify Render Health Check & Zero-Downtime
        run: |
          echo "✓ Verificación de estabilidad: Render Static Site listo para recibir tráfico con ConfigCat SDK."
