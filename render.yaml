# Render Blueprint Specification
# Taller 6: Continuous Deployment de Aplicación React 18 + Vite + ConfigCat
services:
  - type: web
    name: pagos-express-cd
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
